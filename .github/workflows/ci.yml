# CI du devis gratuit : lint, tests unitaires, build + tests d'intégration,
# audit des dépendances. Tourne sur chaque push vers main et chaque pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un nouveau push annule le run précédent de la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  unit:
    name: Tests unitaires (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  integration:
    name: Build + tests d'intégration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build de production
        run: npm run build
      # Les tests démarrent l'app construite (next start) en mode démo, avec un
      # stockage temporaire : aucun secret ni service externe n'est nécessaire.
      - name: Tests d'intégration
        run: npm run test:integration

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Vulnérabilités élevées ou critiques (dépendances de production)
        run: npm audit --omit=dev --audit-level=high
